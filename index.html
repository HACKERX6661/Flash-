<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TTGO T-Display GIF Studio - Clean Flasher</title>
    <script src="https://unpkg.com/esptool-js@0.5.2/bundle.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 400px; text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px 0; width: 100%; }
        button:hover { background: #2563eb; }
        input[type="file"] { margin: 15px 0; width: 100%; }
        #console { background: #000; color: #0f0; font-family: monospace; padding: 10px; height: 150px; overflow-y: auto; text-align: left; font-size: 12px; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TTGO T-Display GIF Studio</h2>
        <p>WLAN-freier direkter GIF-Flasher</p>
        
        <button id="connectBtn">1. ESP32 Verbinden</button>
        
        <input type="file" id="gifFile" accept=".gif">
        
        <button id="flashBtn" disabled>2. Speicher löschen & GIF flashen</button>

        <div id="console">Warte auf Verbindung...</div>
    </div>

    <script>
        let port;
        let transport;
        let esptool;
        let selectedFile = null;

        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const gifInput = document.getElementById('gifFile');
        const consoleDiv = document.getElementById('console');

        function log(text) {
            consoleDiv.innerHTML += text + "<br>";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                transport = new ESPWebSerialTransport(port);
                esptool = new ESPLoader({
                    transport: transport,
                    baudrate: 921600,
                    romBaudrate: 115200,
                    logger: {
                        log: log,
                        debug: log,
                        error: log
                    }
                });

                await esptool.connect();
                log("ESP32 erfolgreich verbunden!");
                connectBtn.style.backgroundColor = "#22c55e";
                connectBtn.innerText = "Verbunden";
                if (selectedFile) flashBtn.disabled = false;
            } catch (e) {
                log("Verbindungsfehler: " + e.message);
            }
        });

        gifInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile && port) {
                flashBtn.disabled = false;
            }
            log("GIF geladen: " + selectedFile.name);
        });

        flashBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            flashBtn.disabled = true;
            try {
                log("=== Starte Flash-Vorgang ===");
                
                // SCHRITT 1: Komplettes Löschen des Speichers (Radiert jeden alten WLAN-Müll aus)
                log("Lösche Flash-Speicher vollständig (Full Memory Erase)...");
                await esptool.eraseFlash();
                log("Speicher erfolgreich geleert!");

                // SCHRITT 2: GIF-Daten einlesen
                const buffer = await selectedFile.arrayBuffer();
                const binaryData = new Uint8Array(buffer);

                // SCHRITT 3: Schreiben an die Startadresse (0x10000) ohne WLAN-Routinen
                log("Schreibe sauberen Payload auf ESP32...");
                const fileArray = [{ data: binaryData, address: 0x10000 }];

                await esptool.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    flashMode: "dio",
                    flashFreq: "40m",
                    reportProgress: (fileIndex, written, total) => {
                        let progress = Math.floor((written / total) * 100);
                        if (progress % 20 === 0) {
                            log(`Fortschritt: ${progress}%`);
                        }
                    }
                });

                log("Flash erfolgreich abgeschlossen! Führe Neustart aus...");
                await esptool.hardReset();
                log("Dein GIF läuft jetzt in der Endlosschleife!");

            } catch (e) {
                log("Fehler beim Flashen: " + e.message);
            } finally {
                flashBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
