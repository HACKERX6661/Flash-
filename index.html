<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TTGO T-Display GIF Studio</title>
    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.4.3/lib/index.js";
        window.ESPLoader = ESPLoader;
        window.Transport = Transport;
    </script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 450px; text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px 0; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        input[type="file"] { margin: 15px 0; width: 100%; color: #94a3b8; }
        #console { background: #000; color: #4ade80; font-family: monospace; padding: 12px; height: 160px; overflow-y: auto; text-align: left; font-size: 12px; border-radius: 6px; margin-top: 15px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TTGO T-Display GIF Studio</h2>
        <p style="color: #94a3b8; font-size: 14px;">WLAN-freier Direct Flasher</p>
        
        <button id="connectBtn">1. ESP32 Verbinden</button>
        <input type="file" id="gifFile" accept=".gif">
        <button id="flashBtn" disabled>2. Speicher löschen & GIF aufspielen</button>

        <div id="console">Warte auf Verbindung...</div>
    </div>

    <script>
        let port;
        let transport;
        let esptool;
        let selectedFile = null;

        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const gifInput = document.getElementById('gifFile');
        const consoleDiv = document.getElementById('console');

        function log(text) {
            consoleDiv.innerHTML += text + "<br>";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            try {
                if (!window.ESPLoader || !window.Transport) {
                    throw new Error("Library lädt noch... Bitte 2 Sekunden warten und erneut klicken.");
                }

                port = await navigator.serial.requestPort();
                transport = new window.Transport(port);
                
                esptool = new window.ESPLoader({
                    transport: transport,
                    baudrate: 921600,
                    romBaudrate: 115200,
                    terminal: {
                        clean: () => { consoleDiv.innerHTML = ""; },
                        writeLine: (data) => log(data),
                        write: (data) => log(data)
                    }
                });

                log("Verbinde mit ESP32...");
                await esptool.connect();
                log("ESP32 erfolgreich verbunden!");
                connectBtn.style.backgroundColor = "#22c55e";
                connectBtn.innerText = "ESP32 Verbunden";
                
                if (selectedFile) flashBtn.disabled = false;
            } catch (e) {
                log("Verbindungsfehler: " + e.message);
            }
        });

        gifInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile && esptool) {
                flashBtn.disabled = false;
            }
            if (selectedFile) {
                log("GIF ausgewählt: " + selectedFile.name);
            }
        });

        flashBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            flashBtn.disabled = true;
            try {
                log("=== Starte Flash-Prozess ===");
                
                log("Lösche gesamten Flash-Speicher...");
                await esptool.eraseFlash();
                log("Speicher vollständig gelöscht!");

                const buffer = await selectedFile.arrayBuffer();
                const gifBytes = new Uint8Array(buffer);

                log("Schreibe GIF Payload...");
                const fileArray = [{ data: gifBytes, address: 0x10000 }];

                await esptool.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    flashMode: "dio",
                    flashFreq: "40m",
                    reportProgress: (fileIndex, written, total) => {
                        let progress = Math.floor((written / total) * 100);
                        if (progress % 25 === 0) {
                            log(`Fortschritt: ${progress}%`);
                        }
                    }
                });

                log("Flash erfolgreich! Starte ESP32 neu...");
                await esptool.hardReset();
                log("Fertig!");

            } catch (e) {
                log("Fehler: " + e.message);
            } finally {
                flashBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
